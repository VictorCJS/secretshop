{% extends "tienda/base.html" %}

{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}
<h1 class="mb-4">Crear cuenta</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-dark">Registrarme</button>
</form>
<p class="mt-3">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
{% endblock %}
