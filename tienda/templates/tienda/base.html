<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Secret Store in the Hood{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark" style="background-color: #808080;">
    <div class="container">
    <div class="container">
        <a class="navbar-brand" href="{% url 'lista_productos' %}">
    <img src="/media/logo/logo.png"
         alt="Logo de Secret Store in the Hood"
         height="130"
         width="250">
</a>

        <div class="d-flex gap-2 align-items-center">
            <a class="btn btn-sm btn-warning" href="{% url 'ver_carrito' %}">Carrito</a>
            {% if user.is_authenticated %}
                <a class="btn btn-sm btn-outline-light" href="{% url 'mis_pedidos' %}">Mis pedidos</a>
                <span class="text-white">Hola, {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-light">Salir</button>
                </form>
            {% else %}
                <a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">Entrar</a>
                <a class="btn btn-sm btn-light" href="{% url 'registro' %}">Registrarse</a>
            {% endif %}
        </div>
    </div>
</nav>

    <main class="container my-4">
        {% if messages %}
    {% for message in messages %}
        <div class="alert alert-warning">{{ message }}</div>
    {% endfor %}
{% endif %}
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
