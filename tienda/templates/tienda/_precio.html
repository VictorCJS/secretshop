{% if producto.en_oferta %}
<span class="text-muted text-decoration-line-through me-1">${{ producto.precio }}</span>
<span class="fw-bold text-danger">${{ producto.precio_final }}</span>
<span class="badge text-bg-danger ms-1">-{{ producto.descuento_porcentaje }}%</span>
{% else %}
<span class="fw-bold">${{ producto.precio }}</span>
{% endif %}
